name: Build & publish static site

# Builds the Next.js static export on every push to main and publishes the
# generated `out/` folder to the `deploy` branch. Hostinger's Git tool then
# serves the `deploy` branch (which contains the baked site at its root),
# instead of the raw source — fixing the 403 from deploying un-built source.

# DISABLED on WordPress cutover (2026-08-13).
#
# This workflow force-pushes the static export to the `deploy` branch, which
# Hostinger checks out into public_html. With WordPress serving that directory,
# every run would lay .html files back over the top — and because WordPress only
# routes a request to index.php when no matching FILE exists, a single
# index.html re-appearing silently takes that URL back off WordPress.
#
# Re-enable only to roll back to the static site, and remove the WordPress
# .htaccess at the same time.
on:
  # push:
  #   branches: [main]
  # Daily rebuild so date-scheduled blog posts publish themselves. Posts dated in
  # the future are excluded from the build (see src/lib/blog.ts); this run is what
  # picks them up once their date arrives. On every other day the output is
  # identical and the deploy is a no-op.
  #
  # GitHub cron is UTC-only with no DST handling, so 11:00 UTC is 06:00 Central in
  # summer and 05:00 in winter. Irrelevant at one-day granularity.
  # schedule:
  #   - cron: "0 11 * * *"
  #
  # Also disabled. WordPress publishes scheduled posts itself via wp-cron, so
  # the daily rebuild that existed to pick up future-dated articles has no job
  # to do — and left enabled it would redeploy the static site over WordPress
  # once a day, silently.
  workflow_dispatch: # allows manual runs from the Actions tab

permissions:
  contents: write # needed to push the built site to the deploy branch

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the full gate (unit tests, content checks, the anti-doorway
      # duplication check, the build itself, then SEO and link checks against
      # the built out/) before anything is published. The next step force-
      # pushes out/ straight to the deploy branch Hostinger serves, so an
      # unverified build ships live — this is what stands between a broken
      # build and production.
      - name: Verify
        run: pnpm verify

      - name: Publish out/ to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true # keep the deploy branch a single clean commit
          # Preserve the dot-prefixed .htaccess from the export.
          enable_jekyll: true # skip auto-adding .nojekyll; not needed on Apache
          commit_message: "Deploy: ${{ github.sha }}"

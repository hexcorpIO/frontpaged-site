# Local WordPress for developing and verifying the frontpaged theme.
#
# The theme and plugin are bind-mounted from the repo, so editing a PHP file
# here is immediately live in the container — the repo stays the source of
# truth and nothing of value lives in the container's own filesystem.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Surface every notice while building: a PHP warning that only appears in
      # production is the classic way a WordPress migration ships broken.
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp:/var/www/html
      - ../themes/frontpaged:/var/www/html/wp-content/themes/frontpaged
      - ../plugins/frontpaged-core:/var/www/html/wp-content/plugins/frontpaged-core
      - ../migration:/var/www/html/wp-content/migration

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../themes/frontpaged:/var/www/html/wp-content/themes/frontpaged
      - ../plugins/frontpaged-core:/var/www/html/wp-content/plugins/frontpaged-core
      - ../migration:/var/www/html/wp-content/migration
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db:
  wp:
